name: Dependency Security & Audit Scanner

on:
  schedule:
    - cron: '0 4 * * 1' # Weekly on Monday at 04:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'client/package*.json'
      - 'backend/requirements*.txt'

jobs:
  audit-dependencies:
    name: Audit Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Frontend Dependency Audit
        id: frontend_audit
        continue-on-error: true
        working-directory: ./client
        run: |
          npm ci
          npm audit --audit-level=high > ../frontend_audit_report.txt || true
          npm outdated > ../frontend_outdated_report.txt || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Backend Dependency Audit
        id: backend_audit
        continue-on-error: true
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
          pip-audit > ../backend_audit_report.txt || true
          pip list --outdated > ../backend_outdated_report.txt || true

      - name: Report Dependency Issues
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ISSUE_TITLE="🔒 Weekly Dependency Security & Outdated Package Audit"
          
          BODY="## 📦 Dependency Audit Report\n\n"
          
          if [ -s frontend_audit_report.txt ]; then
            BODY="${BODY}### ⚡ Frontend Audit\n\`\`\`\n$(cat frontend_audit_report.txt | head -n 30)\n\`\`\`\n\n"
          fi
          
          if [ -s backend_audit_report.txt ]; then
            BODY="${BODY}### 🐍 Backend Audit\n\`\`\`\n$(cat backend_audit_report.txt | head -n 30)\n\`\`\`\n\n"
          fi
          
          # Create GitHub issue if vulnerabilities exist
          if [ -s frontend_audit_report.txt ] || [ -s backend_audit_report.txt ]; then
            gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --body "$BODY"
          fi
