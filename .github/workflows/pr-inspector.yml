name: PR Quality & Security Inspector

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-inspector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect-pr:
    name: Inspect PR Quality & Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Custom PR Inspector
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/pr_inspector.py

      - name: Post PR Review Comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -f pr_review_summary.md ]; then
            # Comment on PR using GitHub CLI
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file pr_review_summary.md
          fi
