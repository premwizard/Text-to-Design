name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Security audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build application
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0.0,<9.0.0" "pytest-asyncio>=0.23.8" ruff pip-audit

      - name: Run Python linter (Ruff)
        run: ruff check .

      - name: Security audit Python dependencies
        continue-on-error: true
        run: pip-audit

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest tests

  create-ci-failure-issue:
    name: Create CI Failure Issue
    needs: [frontend, backend]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Issue for CI Failure
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          RUN_URL="${GH_SERVER_URL:-https://github.com}/${REPO}/actions/runs/${RUN_ID}"
          ISSUE_TITLE="🚨 CI Failure — ${WORKFLOW_NAME} — ${BRANCH_NAME}"

          # Format job results
          FRONTEND_STATUS="PASSED"
          if [ "$FRONTEND_RESULT" != "success" ]; then
            FRONTEND_STATUS="FAILED (${FRONTEND_RESULT})"
          fi

          BACKEND_STATUS="PASSED"
          if [ "$BACKEND_RESULT" != "success" ]; then
            BACKEND_STATUS="FAILED (${BACKEND_RESULT})"
          fi

          ISSUE_BODY=$(cat <<EOF
# 🚨 CI Failure

## Summary
The GitHub Actions CI pipeline failed.

## Repository
${REPO}

## Workflow
${WORKFLOW_NAME}

## Branch
${BRANCH_NAME}

## Commit
${COMMIT_SHA}

## Commit Message
${COMMIT_MSG}

## Triggered By
${ACTOR}

## Event
${EVENT_NAME}

## GitHub Actions Run
${RUN_URL}

## Failed Jobs
- **Frontend CI**: ${FRONTEND_STATUS}
- **Backend CI**: ${BACKEND_STATUS}

## Next Step
Inspect the [GitHub Actions Run Log](${RUN_URL}) to identify the failing step and error.

---
_This issue was automatically created by CI failure automation (Run ID: ${RUN_ID})._
EOF
          )

          gh issue create \
            --repo "$REPO" \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY"

  close-ci-failure-issues:
    name: Close Resolved CI Failure Issues
    needs: [frontend, backend]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Close Open CI Failure Issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          RUN_URL="${GH_SERVER_URL:-https://github.com}/${REPO}/actions/runs/${RUN_ID}"
          TARGET_TITLE="🚨 CI Failure — ${WORKFLOW_NAME} — ${BRANCH_NAME}"

          # Find all open issues matching the title for this workflow and branch
          OPEN_ISSUES=$(gh issue list --repo "$REPO" --state open --json number,title --jq ".[] | select(.title == \"$TARGET_TITLE\") | .number")

          if [ -z "$OPEN_ISSUES" ]; then
            echo "No open CI failure issues found for branch '${BRANCH_NAME}'."
            exit 0
          fi

          COMMENT_BODY=$(cat <<EOF
✅ **CI Pipeline Resolved**

The CI pipeline for branch \`${BRANCH_NAME}\` passed successfully in [Run #${RUN_ID}](${RUN_URL}) (Commit \`${COMMIT_SHA}\`).

Automatically closing this CI failure issue.
EOF
          )

          for ISSUE_NUM in $OPEN_ISSUES; do
            echo "Closing CI failure issue #${ISSUE_NUM}..."
            gh issue close "$ISSUE_NUM" --repo "$REPO" --comment "$COMMENT_BODY"
          done